services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema_aserradero_app
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT:-3000}
      BACKUP_DIRECTORY: ${BACKUP_DIRECTORY:-/backups}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # Seguridad: false por defecto; en producción NUNCA habilitar (usar migraciones).
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
      # Licenciamiento / updates on-prem (Pilar 2 cliente)
      APP_VERSION: ${APP_VERSION:-0.0.1}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
      LICENSE_PUBLIC_KEY_PEM: ${LICENSE_PUBLIC_KEY_PEM:-}
      LICENSE_ENFORCEMENT: ${LICENSE_ENFORCEMENT:-grace}
      LICENSE_CHECK_INTERVAL_MS: ${LICENSE_CHECK_INTERVAL_MS:-86400000}
      LICENSE_GRACE_HOURS: ${LICENSE_GRACE_HOURS:-72}
      LICENSE_STATE_PATH: ${LICENSE_STATE_PATH:-./license}
      LICENSE_CLOCK_SKEW_SEC: ${LICENSE_CLOCK_SKEW_SEC:-300}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATES_AUTO_ENABLED: ${UPDATES_AUTO_ENABLED:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./backups:/backups
      - ./license:/app/license
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: sistema_aserradero_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT_PUBLISH:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
